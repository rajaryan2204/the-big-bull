<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-q-12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="badge-q-12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow-q-12" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="360" rx="16" fill="url(#bg-q-12)" stroke="#334155" stroke-width="2"/>

  <!-- Top Header Bar -->
  <g transform="translate(24, 28)">
    <rect width="130" height="26" rx="6" fill="url(#badge-q-12)"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">VISION BOOST</text>
    
    <text x="145" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">QUESTION #12 • BASIC TECHNICAL CONCEPTS</text>
  </g>

  <!-- Title -->
  <text x="24" y="86" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Galilean Equivalence in Vacuum</text>

  <!-- Central Diagram Canvas Box -->
  <rect x="24" y="104" width="552" height="175" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#shadow-q-12)"/>

  <!-- Technical Schematic Elements based on clueDiagramType -->
  <g transform="translate(40, 120)">
    <!-- Grid guidelines -->
    <line x1="0" y1="35" x2="520" y2="35" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="0" y1="75" x2="520" y2="75" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="0" y1="115" x2="520" y2="115" stroke="#1E293B" stroke-dasharray="4,4"/>

    <!-- Key Indicator Badges -->
    <circle cx="28" cy="70" r="18" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <text x="28" y="75" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>

    <!-- Formula / Key Concept Banner -->
    <rect x="62" y="25" width="445" height="92" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#3B82F6" stroke-width="1"/>
    
    <text x="78" y="55" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">KEY CONCEPT DIAGRAM:</text>
    <text x="78" y="82" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">a = F/m = (m·g)/m = g (~9.8 m/s²) → Mass Cancels Out</text>
    <text x="78" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Deduce the mechanism to evaluate the 4 combat options.</text>
  </g>

  <!-- Bottom Hint Footer -->
  <rect x="24" y="295" width="552" height="42" rx="8" fill="#1E293B" fill-opacity="0.8"/>
  <circle cx="44" cy="316" r="10" fill="#3B82F6"/>
  <text x="44" y="320" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">💡</text>
  <text x="64" y="320" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CLUE: Look for the relationship governing Basic Technical Concepts principles.</text>
</svg>